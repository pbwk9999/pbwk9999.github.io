# ==================================================
#  每个包的详情页地址（Sileo / Zebra / Cydia 用）
#  格式：包名 = Depiction 地址 | SileoDepiction 地址
#  地址写相对路径就行，脚本会自动补上 repo.conf 里的源根地址；
#  只想留其中一个的话，另一边写空：包名 = depictions/xxx/ |
#  不配也能装，只是客户端里的插件详情页会空着。
# ==================================================

com.dcsyhi.zetsu.allinone = depictions/com.dcsyhi.zetsu.allinone/ | sileodepiction/com.dcsyhi.zetsu.allinone.json

